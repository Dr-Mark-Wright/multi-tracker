[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "multitracker"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["numpy>=2.0", "opencv-contrib-python>=4.10"]

[project.optional-dependencies]
yolo = ["ultralytics>=8.4"]
mediapipe = ["mediapipe>=1.1"]
ui = ["PySide6>=6.8", "pyqtgraph>=0.13", "PyOpenGL>=3.1"]

[tool.setuptools.packages.find]
include = ["multitracker*"]
